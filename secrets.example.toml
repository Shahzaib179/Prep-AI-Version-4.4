# Copy this structure into Streamlit Cloud -> Settings -> Secrets.
GROQ_API_KEY = "your_groq_api_key_here"

# Tutor INVITE code: tutors need it once, when they create their tutor account. Leave out to disable tutor sign-up.
# Choose a long, private code and share it only with tutors.
TUTOR_ACCESS_CODE = "choose-a-private-tutor-code"

# Permanent database. Leave out (or empty) to use the local SQLite file (data is lost when a cloud app redeploys).
# Supabase: Project Settings -> Database -> Connection string -> "Transaction pooler" (port 6543). Use the pooler for Streamlit Cloud.
DATABASE_URL = "postgresql://postgres.PROJECT_REF:YOUR_PASSWORD@aws-0-REGION.pooler.supabase.com:6543/postgres"

# Optional (experimental): keep users logged in after a browser refresh/reopen (30 days). Test it in your browser first.
# ENABLE_PERSISTENT_LOGIN = "true"
